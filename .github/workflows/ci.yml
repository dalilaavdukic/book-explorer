name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: coverage run manage.py test
      - run: coverage report
      - run: python manage.py makemigrations --check --dry-run
      - name: Check the OpenAPI schema matches the code
        run: |
          python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
          git diff --exit-code -- openapi.yaml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: CI-DEBUG repeat the suite
        run: |
          for i in $(seq 1 8); do
            echo "=== CI-DEBUG run $i ==="
            npx vitest run --silent=false || true
          done
      - run: npm test
      - name: Check the generated types match the OpenAPI schema
        run: |
          npm run generate:types
          git diff --exit-code -- src/api/schema.d.ts
